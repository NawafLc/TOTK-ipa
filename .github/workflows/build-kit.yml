name: Build TOTK-ipa kit

# Builds everything the iPhone/iPad app needs that does NOT come from the game: the app shell (MacNativeGames' iOS app
# with empty game-module sections, on a Mac) and the import tool's helpers for Linux and macOS. No game file and no key
# is used or needed here. Players run kit/totk_import.py with their own dump to make the IPA on their computer.

on:
  workflow_dispatch:
    inputs:
      macnativegames_ref:
        description: MacNativeGames commit, tag or branch (empty = the commit pinned in kit/MNG_COMMIT, which the self-tests have passed with)
        default: ''
      release:
        description: Publish the kits as a GitHub release
        type: boolean
        default: true
  push:
    branches: ['**']
    paths: ['kit/**', '.github/workflows/build-kit.yml']

permissions:
  contents: read

env:
  MNG_URL: https://github.com/ly05010419/MacNativeGames

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: |
          ref="${{ inputs.macnativegames_ref }}"
          [ -n "$ref" ] || ref="$(cat kit/MNG_COMMIT)"
          sha="$(git ls-remote "$MNG_URL" "$ref" "refs/heads/$ref" "refs/tags/$ref" | head -1 | cut -f1)"
          [ -n "$sha" ] || sha="$ref"
          echo "MacNativeGames $ref = $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  selftest-linux:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch MacNativeGames
        run: git init -q mng && git -C mng fetch -q --depth 1 "$MNG_URL" ${{ needs.resolve.outputs.sha }} && git -C mng checkout -q FETCH_HEAD
      - name: totk-late.bin written in Python, read by the app's C reader
        run: python3 kit/selftest/late_roundtrip.py mng
      - name: Mach-O fill and re-sign on an lld-linked placeholder executable
        run: |
          sudo apt-get install -y -q lld >/dev/null
          LLD="$(ls /usr/bin/ld64.lld* /usr/lib/llvm-*/bin/ld64.lld 2>/dev/null | head -1)"
          printf 'int counter = 3;\nint *p = &counter;\nint start(void) { return *p; }\n' > t.c
          clang -target arm64-apple-ios26.0 -c t.c -o t.o
          clang -target arm64-apple-ios26.0 -c kit/shim/embed.S -o e.o
          "$LLD" -arch arm64 -platform_version ios 26.0 26.0 -e _start -o t.bin t.o e.o -fixup_chains -adhoc_codesign -pie \
            -segprot __TOTKmainW rw rw -segprot __TOTKsubsdk0W rw rw -segprot __TOTKsdkW rw rw -segprot __TOTKX r-x r-x
          python3 kit/selftest/macho_check.py t.bin

  tools-linux:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch MacNativeGames
        run: git init -q mng && git -C mng fetch -q --depth 1 "$MNG_URL" ${{ needs.resolve.outputs.sha }} && git -C mng checkout -q FETCH_HEAD
      - name: Build hactool, SPIRV-Cross and the shader translator
        run: |
          sudo apt-get install -y -q clang zlib1g-dev >/dev/null
          python kit/build_tools.py mng out/linux-x64
          file out/linux-x64/*
          out/linux-x64/spirv-cross --help >/dev/null 2>&1 || true
          out/linux-x64/hactool 2>&1 | head -3 || true
      - run: tar -C out -czf tools-linux-x64.tar.gz linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: tools-linux-x64
          path: tools-linux-x64.tar.gz

  shell-macos:
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Fetch MacNativeGames
        run: git init -q mng && git -C mng fetch -q --depth 1 "$MNG_URL" ${{ needs.resolve.outputs.sha }} && git -C mng checkout -q FETCH_HEAD
      - name: Tools for the iOS build
        run: |
          brew install xcodegen cmake ninja
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build the app shell (no game files)
        run: python kit/build_shell.py mng out/shell
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shell-logs
          path: out/shell-work/logs
      - name: Shell layout
        run: |
          python kit/tools/macho.py info out/shell/v143/TOTK.app/TOTK
          codesign -d --entitlements - --xml out/shell/v143/TOTK.app/TOTK
      - name: The Python 1.4.3 export matches MacNativeGames' C patches
        run: |
          clang -std=gnu11 -O1 -Wall -DTOTK_GAME_V143=1 -Imng/games/totk/runtime mng/games/totk/runtime/game_patches_v143.c \
            kit/selftest/export_check.c -o export_check
          python kit/selftest/check_export.py ./export_check
      - name: Filling the real shell keeps a valid signature
        run: python kit/selftest/macho_check.py out/shell/v143/TOTK.app/TOTK
      - name: Build hactool, SPIRV-Cross and the shader translator for macOS
        run: python kit/build_tools.py mng out/tools/macos-arm64
      - run: |
          tar -C out/shell -czf shell.tar.gz v143
          tar -C out/tools -czf tools-macos-arm64.tar.gz macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: shell
          path: shell.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tools-macos-arm64
          path: tools-macos-arm64.tar.gz

  windows:
    needs: [resolve, shell-macos]
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: make patch mingw-w64-x86_64-gcc
      - name: Fetch MacNativeGames
        run: |
          git init -q mng
          git -C mng fetch -q --depth 1 $env:MNG_URL ${{ needs.resolve.outputs.sha }}
          git -C mng checkout -q FETCH_HEAD
      - name: Build hactool, SPIRV-Cross and the shader translator for Windows
        run: |
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          $env:PATH = "$msys\mingw64\bin;$env:PATH;$msys\usr\bin"
          python kit/build_tools.py mng out/windows-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem out/windows-x64
          $usage = (& out/windows-x64/hactool.exe 2>&1 | Out-String)
          if ($usage -notmatch 'Usage') { Write-Output $usage; exit 1 }
          exit 0   # hactool without arguments exits non-zero after printing its usage
      - name: Python packages as wheels (installed offline by the builder)
        run: python -m pip wheel -q -r mng/games/totk/requirements.txt -w kit/wheels
      - uses: actions/download-artifact@v4
        with:
          name: shell
      - name: Put the kit together
        run: |
          New-Item -ItemType Directory -Force kit/shell, kit/bin, kit/MacNativeGames/games | Out-Null
          tar -xzf shell.tar.gz -C kit/shell
          Copy-Item -Recurse out/windows-x64 kit/bin/windows-x64
          Copy-Item mng/build_app.py, mng/LICENSE, mng/THIRD_PARTY_NOTICES.md kit/MacNativeGames/
          Copy-Item -Recurse mng/games/totk, mng/games/botw kit/MacNativeGames/games/
          Remove-Item -Recurse -Force kit/MacNativeGames/games/totk/prebuilt
          Set-Content kit/MacNativeGames/.kit-commit "${{ needs.resolve.outputs.sha }}"
      - name: Self-test - environment, embedding and IPA on Windows (synthetic game files)
        run: python kit/selftest/assemble_check.py mng kit/shell/v143/TOTK.app
      - name: Self-test - the builder window
        run: python kit/selftest/gui_check.py
      - name: Installer
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force "$dist/kit/tools" | Out-Null
          Copy-Item kit/totk_import.py, kit/gui.py, kit/README.md, kit/windows/NOTICE.txt "$dist/kit/"
          Copy-Item kit/tools/*.py "$dist/kit/tools/"
          foreach ($d in 'MacNativeGames', 'shell', 'bin', 'wheels') { Copy-Item -Recurse "kit/$d" "$dist/kit/$d" }
          # a private copy of this Python 3.14 (python.org build, with tkinter, venv and ensurepip)
          $py = Split-Path (Get-Command python).Source
          Copy-Item -Recurse $py "$dist/python"
          Remove-Item -Recurse -Force "$dist/python/Lib/test", "$dist/python/Lib/site-packages/*" -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Directory -Filter __pycache__ $dist | Remove-Item -Recurse -Force
          & "$dist/python/python.exe" -c "import tkinter, venv, ensurepip, sys; print(sys.version)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          & $iscc "/DSourceDir=$(Resolve-Path $dist)" "/DAppVersion=$version" /Oout kit/windows/installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem out/TOTK-ipa-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/TOTK-ipa-Setup.exe

  package:
    needs: [resolve, selftest-linux, tools-linux, shell-macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Assemble the kits
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          git init -q mng && git -C mng fetch -q --depth 1 "$MNG_URL" "$SHA" && git -C mng checkout -q FETCH_HEAD
          for plat in linux-x64 macos-arm64; do
            k="kits/totk-ipa-kit-$plat"
            mkdir -p "$k/MacNativeGames/games" "$k/shell" "$k/bin" "$k/tools"
            cp kit/totk_import.py kit/gui.py "$k/" && cp kit/tools/*.py "$k/tools/" && cp kit/README.md "$k/README.md"
            cp mng/build_app.py mng/LICENSE mng/THIRD_PARTY_NOTICES.md "$k/MacNativeGames/"
            cp -R mng/games/totk mng/games/botw "$k/MacNativeGames/games/"
            rm -rf "$k/MacNativeGames/games/totk/prebuilt"
            echo "$SHA" > "$k/MacNativeGames/.kit-commit"
            tar -C "$k/shell" -xzf art/shell/shell.tar.gz
            tar -C "$k/bin" -xzf "art/tools-$plat/tools-$plat.tar.gz"
            tar -C kits -czf "totk-ipa-kit-$plat.tar.gz" "totk-ipa-kit-$plat"
          done
          ls -lh totk-ipa-kit-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: totk-ipa-kits
          path: totk-ipa-kit-*.tar.gz
      - name: Publish a release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          tag="kit-$(date -u +%Y%m%d)-${SHA:0:7}"
          gh release create "$tag" art/windows-installer/TOTK-ipa-Setup.exe totk-ipa-kit-*.tar.gz --target "$GITHUB_SHA" \
            --title "TOTK-ipa kit ($tag)" \
            --notes "Windows: run TOTK-ipa-Setup.exe; the builder asks for your game files and makes the IPA. Linux / macOS: the kits, with totk_import.py. Built from MacNativeGames ${SHA}. Contains no game files."
